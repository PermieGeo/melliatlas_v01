services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: melliatlas
      POSTGRES_USER: melliatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - melliatlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melliatlas -d melliatlas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  melliatlas-postgres:
